  </g>
  <g id="text_29">
   <text style="font-weight: 700; font-size: 11.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #376483" x="777.6" y="112.104" transform="rotate(-0 777.6 112.104)">Development / publishing subtotal</text>
  </g>
  <g id="text_30">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #687780" x="74.88" y="524.88" transform="rotate(-0 74.88 524.88)">2009 / 2012: legacy location-based ESA estimates, including small establishments. 2013–2015: ESA mapping observations.</text>
  </g>
  <g id="text_31">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #687780" x="74.88" y="544.968" transform="rotate(-0 74.88 544.968)">2016: wider reporting universe (open marker). 2019 / 2023 / 2025: development/publishing subtotal; later report methods also differ.</text>
  </g>
  <g id="text_32">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #687780" x="74.88" y="565.056" transform="rotate(-0 74.88 565.056)">Dashed links identify related observations, not interpolated annual estimates or a harmonized trend. Bubble area is proportional to employment.</text>
  </g>
  <g id="text_33">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #687780" x="74.88" y="585.144" transform="rotate(-0 74.88 585.144)">Sources: ESA / Siwek 2014 Table D-2; ESA 2017 Tables C-2 and E-2; ESA economic impact reports 2020, 2024 and 2026.</text>
  </g>
  <g id="text_34">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #687780" x="74.88" y="605.232" transform="rotate(-0 74.88 605.232)">Research checked 19 Sep 2026. Exact source citations and values: US-accepted-history.csv. Government software-publisher totals excluded.</text>
  </g>
 </g>
